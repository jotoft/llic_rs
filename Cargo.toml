[package]
name = "llic_rs"
version = "0.5.0"
edition = "2021"
rust-version = "1.87"
authors = ["Johan Toft <johan@jatoft.se>"]
description = "LLIC - Low Latency Image Codec for grayscale images"
repository = "https://github.com/jotoft/llic_rs"
license = "Zlib"
keywords = ["compression", "image", "lossless", "wasm"]
categories = ["compression", "wasm"]
# Keep the published package small: ship only what's needed to build and use the
# crate. `tables/*.bin` are required (included via include_bytes!) and must stay.
exclude = [
    "test_data/",
    "demo/",
    "scripts/",
    "cpp-bench/",
    "llic/",
    ".github/",
    ".claude/",
    "*.zsh",
    "convert_table.py",
    "mise.toml",
    "CLAUDE.md",
    "LLIC_FORMAT_SPEC.md",
    "COMPRESSION_TABLES_GUIDE.md",
]

[workspace]
members = [".", "cpp-bench"]
# Plain `cargo build`/`test`/`clippy` operate on the library only; the C++
# comparison crate is built explicitly with `-p llic-cpp-bench` and needs the
# `llic` git submodule checked out.
default-members = ["."]

[features]
default = ["std"]
std = ["dep:num_cpus"]
# The llic_compress command-line tool (PNG/PGM I/O and argument parsing)
cli = ["std", "dep:image", "dep:clap"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
thiserror = "1.0"

# Optional: only for native builds
num_cpus = { version = "1.16", optional = true }
# Optional: only for the llic_compress CLI (feature "cli")
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }

# Optional: only for WASM builds
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
criterion = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }

[lib]
name = "llic"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "llic_compress"
path = "src/bin/llic_compress.rs"
required-features = ["cli"]

[[bench]]
name = "llic_benchmark"
harness = false

# Native CPU optimizations for benchmarking
# Run with: RUSTFLAGS="-C target-cpu=native" cargo bench
# Or use the profile below with: cargo bench --profile bench-native
[profile.bench-native]
inherits = "release"
lto = true
codegen-units = 1

[profile.release]
lto = "thin"

[profile.bench]
debug = true
