[package]
name = "llic-cpp-bench"
version = "0.0.0"
edition = "2021"
description = "Dev-only C++ reference FFI and comparison benchmarks for llic_rs (not published)"
license = "Zlib"
publish = false

[lib]
name = "llic_cpp_bench"
path = "src/lib.rs"

[dependencies]
llic = { package = "llic_rs", path = ".." }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
criterion = "0.5"
image = { version = "0.25", default-features = false, features = ["webp"] }

[[bench]]
name = "comparison"
harness = false
